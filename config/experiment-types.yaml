types:
  - name: "A/B Test"
    description: "Compare control group against variant group."
  - name: "Channel Test"
    description: "Launch in new communication channel with historical benchmark control."
  - name: "Messaging Test"
    description: "Vary message copywriting and content structure."
  - name: "Pricing Test"
    description: "Vary pricing strategy or package constructs."
  - name: "Offer Test"
    description: "Provide alternative values/incentives (e.g. audits vs gift cards)."
  - name: "ICP Test"
    description: "Target outbound towards a different profile vertical."
  - name: "Persona Test"
    description: "Vary messages across target roles (e.g., CMO vs VP Sales)."
  - name: "Landing Page Test"
    description: "Vary web elements on landing copy."
  - name: "Product Experiment"
    description: "Vary feature-flagged user journeys."
  - name: "Sales Process Test"
    description: "A/B test sales call decks or trial duration structures."
  - name: "Retention Experiment"
    description: "Vary onboarding workflows to alter churn rates."
  - name: "Activation Experiment"
    description: "Optimize user registration and first-mile product triggers."
  - name: "Partnership Test"
    description: "Joint marketing campaigns with external ecosystems."
